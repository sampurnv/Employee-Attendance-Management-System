version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: attendance-mongodb
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: attendance_db
    volumes:
      - mongodb_data:/data/db
    networks:
      - attendance-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: attendance-backend
    ports:
      - "8080:8080"
    environment:
      SPRING_DATA_MONGODB_URI: mongodb://mongodb:27017/attendance_db
    depends_on:
      - mongodb
    networks:
      - attendance-network
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: attendance-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - attendance-network
    restart: unless-stopped

volumes:
  mongodb_data:

networks:
  attendance-network:
    driver: bridge
